name: Short diario
on:
  schedule:
    - cron: "0 15 * * *"   # todos los días a las 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin subir a YouTube"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: short-de-prueba
          path: output/short.mp4
      - name: Guardar historial
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "historial" && git push)
